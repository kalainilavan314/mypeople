[project]
name = "my-people-api"
version = "0.1.0"
description = "My People (என் மக்கள்) API: FastAPI modular monolith"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162",
    "uvicorn[standard]>=0.54",
    "pydantic-settings>=2.16",
    "sqlalchemy>=2.1",
    "alembic>=1.20",
    "psycopg[binary]>=3.3",
    "pyjwt>=2.15",
    "bcrypt>=5.0",
    "cryptography>=50.0",  # AES-256-GCM for identity evidence
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1",
    "httpx>=0.28",  # required by FastAPI's TestClient
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

# Data files read at run time, so a non-editable install (the Docker image) has them.
[tool.setuptools.package-data]
"app.modules.identity.registration" = ["*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
