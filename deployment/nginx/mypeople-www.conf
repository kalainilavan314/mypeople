# Reference copy of the production site for www.tmk.lk (12 November 2026).
# Server path: /etc/nginx/sites-available/mypeople-www (enabled in sites-enabled).
# The server is the source of truth: change it there (nginx -t, then reload), then update this copy.
#
# www.tmk.lk serves the live member PWA and its APIs exactly as the main site (my-people.conf,
# 178.128.126.35.nip.io) does. It has its own server block because the main site's certificate is
# managed by certbot's nginx installer inside that file, which this deploy does not touch.
# tmk.lk itself joins this site (server_name and certificate) once its DNS record resolves.

server {
    listen 80;
    listen [::]:80;
    server_name www.tmk.lk;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.tmk.lk;

    ssl_certificate /etc/letsencrypt/live/www.tmk.lk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.tmk.lk/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 12m;

    # FastAPI /v1 beside Express, as on the main site.
    include /etc/nginx/snippets/mypeople-fastapi-v1.conf;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwritten, never appended: both APIs trust this from 127.0.0.1 for lockouts and audit.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
