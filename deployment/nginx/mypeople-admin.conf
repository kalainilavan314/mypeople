# Reference copy of the production admin dashboard site (12 November 2026).
# Server path: /etc/nginx/sites-available/mypeople-admin (enabled in sites-enabled).
# The server is the source of truth: change it there (nginx -t, then reload), then update this copy.

# My People admin dashboard (apps/admin-web), its own name so its pages can sit at the root.
# admin.tmk.lk is the address; the nip.io name keeps working, as the dashboard has no address built in.
# Sign-in cookies belong to the name they were set on, so each name has its own sessions.
# One Let's Encrypt certificate (lineage admin.178.128.126.35.nip.io) covers both names.
server {
    listen 80;
    listen [::]:80;
    server_name admin.tmk.lk admin.178.128.126.35.nip.io;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name admin.tmk.lk admin.178.128.126.35.nip.io;

    ssl_certificate /etc/letsencrypt/live/admin.178.128.126.35.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.178.128.126.35.nip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Gallery photos and finance slips pass through the dashboard's server actions.
    client_max_body_size 15m;

    location / {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwritten, never appended: the API trusts this from 127.0.0.1 for lockouts and audit.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
