# The member app's old name: the API for APKs built before the move, the APK downloads, and a
# permanent redirect of every page to app.tmk.lk.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name app.178.128.126.35.nip.io;

    ssl_certificate /etc/letsencrypt/live/app.178.128.126.35.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.178.128.126.35.nip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include /etc/nginx/snippets/mypeople-fastapi-v1.conf;

    location ^~ /android/ {
        alias /var/www/mypeople-downloads/android/;
        types { application/vnd.android.package-archive apk; }
        default_type application/octet-stream;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff";
    }

    location / {
        return 301 https://app.tmk.lk$request_uri;
    }
}

