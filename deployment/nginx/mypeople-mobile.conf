# Reference copy of the production site for the app's web version (12 November 2026).
# Server path: /etc/nginx/sites-available/mypeople-mobile (enabled in sites-enabled).
# The server is the source of truth: change it there (nginx -t, then reload), then update this copy.
#
# One app for members and staff since 12 November 2026 (OD-26): app.tmk.lk serves it, and the staff
# screens are its Staff section at /staff. staff.tmk.lk sends its pages there but still answers /v1,
# because staff APKs installed before the change call the API on that name. The old nip.io names
# forward their pages to tmk.lk and still answer /v1 (and /android/) for the APKs built before the
# move to tmk.lk. One Let's Encrypt certificate (lineage app.178.128.126.35.nip.io) covers all four names.

server {
    listen 80;
    listen [::]:80;
    server_name app.tmk.lk staff.tmk.lk app.178.128.126.35.nip.io staff.178.128.126.35.nip.io;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# The app's web version; /v1 goes to FastAPI on the same name, so the app needs no CORS.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name app.tmk.lk;

    ssl_certificate /etc/letsencrypt/live/app.178.128.126.35.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.178.128.126.35.nip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/mypeople-mobile/current/app;
    index index.html;

    include /etc/nginx/snippets/mypeople-fastapi-v1.conf;

    # The separate staff APK was retired with the one app; its old link now gives the one app.
    location = /android/my-people-staff.apk {
        return 301 /android/my-people-member.apk;
    }

    # Android test builds of the app (APKs signed with the expo prebuild debug key), as plain downloads.
    location ^~ /android/ {
        alias /var/www/mypeople-downloads/android/;
        types { application/vnd.android.package-archive apk; }
        default_type application/octet-stream;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /_expo/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}

# The old staff app name: the API for staff APKs installed before the one app, and a permanent
# redirect of every page to the app's Staff section.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name staff.tmk.lk;

    ssl_certificate /etc/letsencrypt/live/app.178.128.126.35.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.178.128.126.35.nip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include /etc/nginx/snippets/mypeople-fastapi-v1.conf;

    location / {
        return 301 https://app.tmk.lk/staff$request_uri;
    }
}

# The member app's old name: the API for APKs built before the move, the APK downloads, and a
# permanent redirect of every page to app.tmk.lk.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name app.178.128.126.35.nip.io;

    ssl_certificate /etc/letsencrypt/live/app.178.128.126.35.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.178.128.126.35.nip.io/privkey.pem;
