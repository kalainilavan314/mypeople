# Reference copy of the production site for the Expo apps' web versions (12 November 2026).
# Server path: /etc/nginx/sites-available/mypeople-mobile (enabled in sites-enabled).
# The server is the source of truth: change it there (nginx -t, then reload), then update this copy.
#
# The apps live at app.tmk.lk (member) and staff.tmk.lk (staff). Their web builds call the API on
# their own tmk.lk name, so the old nip.io names forward their pages to tmk.lk. Those names still
# answer /v1 (and /android/) directly, because the APKs built before the move call the API there.
# One Let's Encrypt certificate (lineage app.178.128.126.35.nip.io) covers all four names.

server {
    listen 80;
    listen [::]:80;
    server_name app.tmk.lk staff.tmk.lk app.178.128.126.35.nip.io staff.178.128.126.35.nip.io;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# The member app's web version; /v1 goes to FastAPI on the same name, so the app needs no CORS.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name app.tmk.lk;

    ssl_certificate /etc/letsencrypt/live/app.178.128.126.35.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.178.128.126.35.nip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/mypeople-mobile/current/app;
    index index.html;

    include /etc/nginx/snippets/mypeople-fastapi-v1.conf;

    # Android test builds of the apps (APKs signed with the expo prebuild debug key), as plain downloads.
    location ^~ /android/ {
        alias /var/www/mypeople-downloads/android/;
        types { application/vnd.android.package-archive apk; }
        default_type application/octet-stream;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /_expo/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}

