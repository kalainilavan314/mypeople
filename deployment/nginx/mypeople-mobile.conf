# Reference copy of the production site for the Expo apps' web versions (10 November 2026).
# Server path: /etc/nginx/sites-available/mypeople-mobile (enabled in sites-enabled).
# The server is the source of truth: change it there (nginx -t, then reload), then update this copy.

# Web versions of the Expo member and staff apps (apps/member-mobile, apps/staff-mobile).
server {
    listen 80;
    listen [::]:80;
    server_name app.178.128.126.35.nip.io staff.178.128.126.35.nip.io;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# The member app's web version; /v1 goes to FastAPI on the same name, so the app needs no CORS.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name app.178.128.126.35.nip.io;

    ssl_certificate /etc/letsencrypt/live/app.178.128.126.35.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.178.128.126.35.nip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/mypeople-mobile/current/app;
    index index.html;

    include /etc/nginx/snippets/mypeople-fastapi-v1.conf;

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /_expo/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}

