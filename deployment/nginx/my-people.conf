# Reference copy of the production My People Nginx site.
# Server path: /etc/nginx/sites-available/default (enabled as sites-enabled/default)
# Copied 25 October 2026; the /v1 include was added on the server on 10 November 2026.
# The server is the source of truth: change it there (nginx -t, then reload),
# then update this copy. See deployment/nginx/README.md.

# My People (en makkal) — served on the bare IP (default server).
# IBC Facts keeps its own server block matched by server_name.
server {
    server_name 178.128.126.35.nip.io _;

    client_max_body_size 12m;

    # FastAPI /v1 beside Express (deployment/nginx/README.md)
    include /etc/nginx/snippets/mypeople-fastapi-v1.conf;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/178.128.126.35.nip.io/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/178.128.126.35.nip.io/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = 178.128.126.35.nip.io) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 178.128.126.35.nip.io _;
    return 404; # managed by Certbot


}