# STAGING copy of My People for user acceptance testing (Gate G1). Synthetic data only.
server {
    listen 80;
    listen [::]:80;
    server_name staging-app.178.128.126.35.nip.io staging-staff.178.128.126.35.nip.io staging-admin.178.128.126.35.nip.io;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Staging app (web version), members and the Staff section; /v1 goes to the staging API on the same name.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name staging-app.178.128.126.35.nip.io;

    ssl_certificate /etc/letsencrypt/live/staging-app.178.128.126.35.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging-app.178.128.126.35.nip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    # A test copy: keep it out of search engines.
    add_header X-Robots-Tag "noindex, nofollow" always;

    root /var/www/mypeople-staging/current/app;
    index index.html;

    include /etc/nginx/snippets/mypeople-staging-v1.conf;

    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location /_expo/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}

# The old staging staff app address. Since 12 November 2026 the staff screens are the app's Staff
# section (OD-26: one app for members and staff), so every page goes there; /v1 still answers.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name staging-staff.178.128.126.35.nip.io;

    ssl_certificate /etc/letsencrypt/live/staging-app.178.128.126.35.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging-app.178.128.126.35.nip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    add_header X-Robots-Tag "noindex, nofollow" always;

    include /etc/nginx/snippets/mypeople-staging-v1.conf;

    location / {
        return 301 https://staging-app.178.128.126.35.nip.io/staff$request_uri;
    }
}

# Staging dashboard.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name staging-admin.178.128.126.35.nip.io;

    ssl_certificate /etc/letsencrypt/live/staging-app.178.128.126.35.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging-app.178.128.126.35.nip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Gallery photos and finance slips pass through the dashboard's server actions.
    client_max_body_size 15m;

    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwritten, never appended: the API trusts this from 127.0.0.1 for lockouts and audit.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
