# Local development: PostgreSQL 17, and optionally the FastAPI service.
#
# From the repository root, after copying .env.example to .env:
#   docker compose --env-file .env -f deployment/docker-compose.dev.yml up -d db
# Then build the schema from the host, as on a new database:
#   npm run migrate --prefix server
#   cd services/api && python -m alembic upgrade head
# To run the API in a container as well:
#   docker compose --env-file .env -f deployment/docker-compose.dev.yml --profile api up -d
#
# Development values only. Production does not run on Docker (see deployment/README.md).

name: my-people-dev

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: my_people
      POSTGRES_USER: my_people
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      # Bound to this computer only.
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U my_people -d my_people"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    profiles: ["api"]
    build: ../services/api
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql://my_people:${POSTGRES_PASSWORD}@db:5432/my_people
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      NIC_PEPPER: ${NIC_PEPPER:?set NIC_PEPPER in .env}
      EVIDENCE_STORAGE_DIR: /var/lib/my-people/evidence
      EVIDENCE_ENCRYPTION_KEY: ${EVIDENCE_ENCRYPTION_KEY:?set EVIDENCE_ENCRYPTION_KEY in .env}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - evidence:/var/lib/my-people/evidence

volumes:
  db-data:
  evidence:
