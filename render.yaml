# Render blueprint — one free web service that serves BOTH the API and the
# built PWA. Single origin means the app's relative /api calls just work: no
# CORS, no proxy rewrites, one URL to share.
#
# Postgres and file storage are NOT declared here: both live on Supabase's free
# tier (Render's own free Postgres expires after 30 days). See DEPLOY.md.
services:
  - type: web
    name: northunity
    runtime: node
    plan: free
    region: singapore # closest free region to Sri Lanka
    healthCheckPath: /api/health

    buildCommand: npm ci --prefix app && npm run build --prefix app && npm ci --prefix server --omit=dev
    startCommand: node server/src/index.js

    envVars:
      - key: NODE_ENV
        value: production

      # Generated once by Render and then held stable. Rotating it signs
      # everyone out, so leave it alone after the first deploy.
      - key: JWT_SECRET
        generateValue: true

      # sync: false = "prompt me, do not store in the repo".
      # Supabase session-pooler URI, ending in ?sslmode=require.
      - key: DATABASE_URL
        sync: false

      # NEVER regenerate: this salts every stored NIC hash. If it changes, no
      # existing member can log in again. Set once, keep a backup.
      - key: NIC_PEPPER
        sync: false

      # Closed-pilot gate. Signup has no OTP or identity check, so this is the
      # only thing preventing open registration. The server refuses to boot in
      # production unless it is set.
      - key: SIGNUP_INVITE_CODE
        sync: false

      # Supabase Storage — required here, because Render's free filesystem is
      # ephemeral: without these, every avatar and donation slip is lost on each
      # deploy and each sleep/wake cycle.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: npm-uploads
