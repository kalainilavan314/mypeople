name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  member-pwa:
    name: Member PWA build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --prefix app
      # "build" runs tsc first, so this also fails on type errors.
      - run: npm run build --prefix app

  api:
    name: API tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: my_people_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throwaway database and signing key for CI only, not real credentials.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/my_people_ci
      JWT_SECRET: ci-only-jwt-secret-not-used-anywhere-else
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # A new database is built the way the README describes: the Express
      # migrations first, then Alembic from its baseline. The installed server
      # packages also let the tests run server/src/lib.js for the
      # cross-language auth checks.
      - name: Apply the Express migrations
        run: npm ci --prefix ../../server && npm run migrate --prefix ../../server
      - run: python -m pip install -e ".[dev]"
      - run: python -m alembic upgrade head
      - run: python -m pytest
