name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  member-pwa:
    name: Member PWA build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --prefix app
      # "build" runs tsc first, so this also fails on type errors.
      - run: npm run build --prefix app

  express-api:
    name: Express API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --prefix server
      - run: npm test --prefix server

  packages:
    name: Shared packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run test:packages
      - run: npm run typecheck:packages
      # The client's types must match the API: export the OpenAPI document,
      # regenerate, and fail if anything changed that was not committed.
      - name: API client is up to date with the API
        run: |
          python -m pip install -e "services/api[dev]"
          (cd services/api && python scripts/export_openapi.py)
          npm run generate -w @my-people/api-client
          git diff --exit-code -- packages/api-client

  mobile-apps:
    name: Expo app (members and the Staff section)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Accessibility lint for mobile apps
        run: |
          npm run lint -w @my-people/member-mobile
      - name: Typecheck, check Expo versions, bundle for Android and web
        env:
          EXPO_PUBLIC_API_URL: http://localhost:8000
        run: |
          npm run typecheck -w @my-people/mobile-ui
          cd apps/member-mobile
          npx tsc --noEmit && npx expo install --check \
            && npx expo export --platform android --output-dir dist-android \
            && npx expo export --platform web --output-dir dist-web

  admin-web:
    name: Next.js admin dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck --workspace @my-people/admin-web
      - run: npm run lint --workspace @my-people/admin-web
      - run: npm test --workspace @my-people/admin-web
      - run: npm run build --workspace @my-people/admin-web
      - name: Rendered admin accessibility and contrast sweep
        env:
          A11Y_BASE_URL: http://127.0.0.1:3000
        run: |
          npm run start --workspace @my-people/admin-web -- --port 3000 > admin-a11y.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; cat admin-a11y.log' EXIT
          node scripts/browser/admin-rendered-dom.mjs

  api:
    name: API tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: my_people_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throwaway database and signing key for CI only, not real credentials.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/my_people_ci
      JWT_SECRET: ci-only-jwt-secret-not-used-anywhere-else
      NIC_PEPPER: ci-only-nic-pepper-not-used-anywhere-else
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # A new database is built the way the README describes: the Express
      # migrations first, then Alembic from its baseline. The installed server
      # packages also let the tests run server/src/lib.js for the
      # cross-language auth checks.
      - name: Apply the Express migrations
        run: npm ci --prefix ../../server && npm run migrate --prefix ../../server
      - run: python -m pip install -e ".[dev]"
      - run: python -m alembic upgrade head
      - run: python -m pytest

  api-image:
    name: FastAPI container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Builds services/api/Dockerfile and checks the image starts its app factory.
      - run: docker build -t my-people-api services/api
      - name: The image can import and build the app
        run: >
          docker run --rm
          -e DATABASE_URL=postgresql://nobody@127.0.0.1:1/none
          -e JWT_SECRET=ci-only-jwt-secret-not-used-anywhere-else
          -e NIC_PEPPER=ci-only-nic-pepper-not-used-anywhere-else
          my-people-api python -c "from app.main import create_app; print(len(create_app().routes), 'routes')"

  infrastructure-templates:
    name: Candidate reverse proxy syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate the FastAPI Nginx drop-in in an isolated server block
        run: >-
          docker run --rm
          -v "$PWD/deployment/nginx/ci-nginx.conf:/etc/nginx/nginx.conf:ro"
          -v "$PWD/deployment/nginx/fastapi-v1-snippet.conf.example:/etc/nginx/snippets/mypeople-fastapi-v1.conf:ro"
          nginx:1.27-alpine nginx -t

  gate-g1-validator:
    name: Gate G1 evidence validation tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s deployment/tests -p 'test_gate_g1.py'
