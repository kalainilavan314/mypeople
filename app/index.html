<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!--
      interactive-widget=resizes-content: when the on-screen keyboard opens,
      shrink the LAYOUT viewport, not just the visual one. The default
      (resizes-visual) leaves 100dvh at full height, so the app shell — which is
      a fixed-height, overflow:hidden column — keeps the focused field parked
      underneath the keyboard. It looks and feels like the field will not accept
      input. Chrome/Android honours this; iOS is handled by the visualViewport
      fallback in src/lib/viewport.ts.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#10141C" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="என் மக்கள் · My People · இலக்கு ஒன்று தான் இனத்தின் விடிவு" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Fonts are self-hosted and subset via @fontsource, imported in src/main.tsx.
         No third-party font request, no render-blocking external stylesheet. -->
    <title>என் மக்கள் · My People</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
